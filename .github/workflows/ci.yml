name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '00 04 * * 1' # 4am every Monday
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  # Eigen, Boost, Catch2 and the reference spglib all arrive through
  # FetchContent. Parking them outside the build tree lets a single cache entry
  # cover both the downloads and their built artefacts.
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

jobs:
  #
  # Build, test and install across the supported toolchains.
  #
  # MSVC is deliberately absent: CMakeLists.txt:20 hard-errors on anything but
  # GCC 15+ / Clang, because the library needs <generator>, compiles as gnu++23
  # and sets a constexpr budget flag with no portable spelling. The source
  # itself is platform-neutral (no POSIX headers, no _WIN32), so adding a
  # windows-latest / MSVC entry here is mostly a matter of relaxing that gate
  # and supplying /constexpr:steps -- but nothing has been compiled on MSVC
  # yet, so it stays out of CI rather than sitting permanently red.
  #
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 15 (Debug)
            cc: gcc-15
            cxx: g++-15
            build_type: Debug
            oracle: 'OFF'
          - name: GCC 15 (Release + oracle)
            cc: gcc-15
            cxx: g++-15
            build_type: Release
            oracle: 'ON'
          - name: Clang 20 (Debug)
            cc: clang-20
            cxx: clang++-20
            build_type: Debug
            oracle: 'OFF'
          - name: Clang 20 (Release + oracle)
            cc: clang-20
            cxx: clang++-20
            build_type: Release
            oracle: 'ON'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GCC 15 goes on for every entry, not just the GCC ones: Clang here uses
      # libstdc++, and <generator> plus the C++23 range adaptors only exist in
      # libstdc++ 15.
      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 ninja-build

      - name: Install Clang 20
        if: startsWith(matrix.cc, 'clang')
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.cc }}-${{ matrix.build_type }}-${{ matrix.oracle }}
          max-size: 500M

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: deps-${{ matrix.cc }}-${{ matrix.build_type }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            deps-${{ matrix.cc }}-${{ matrix.build_type }}-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCPPCRYSTAL_BUILD_TESTS=ON \
            -DCPPCRYSTAL_BUILD_ORACLE_TESTS=${{ matrix.oracle }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

      # A smoke run of the [!benchmark] cases, not a regression gate: a shared
      # CI runner's timings are far too noisy for that (see the interleaved
      # triplicate protocol the numbers in the perf notes were taken with).
      # What this catches is the benchmark target silently rotting -- failing
      # to build, or throwing on a cell it used to handle.
      - name: Benchmarks (smoke)
        if: matrix.build_type == 'Release'
        run: ./build/tests/cppcrystal_tests "[!benchmark]" --benchmark-samples 3

      - name: Install
        run: cmake --install build

  #
  # Address/UB sanitizers against the reference spglib oracle. Split out
  # because it is the slowest configuration and the one whose failures say
  # something the plain builds cannot.
  #
  sanitizers:
    name: GCC 15 (ASan/UBSan + oracle)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: asan
          max-size: 500M

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: deps-asan-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            deps-asan-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPPCRYSTAL_BUILD_TESTS=ON \
            -DCPPCRYSTAL_BUILD_ORACLE_TESTS=ON \
            -DCPPCRYSTAL_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  #
  # Formatting. .clang-format is `BasedOnStyle: LLVM`; this only checks the
  # first-party tree, never the vendored mdspan.
  #
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          find src include tests tools -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            ! -path 'include/cppcrystal/third_party/*' \
            -print0 | xargs -0 clang-format --dry-run -Werror
