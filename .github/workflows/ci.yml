name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '00 04 * * 1' # 4am every Monday
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# FETCHCONTENT_BASE_DIR is passed as -D on each configure line, never through
# `env:`: FetchContent.cmake declares it as a plain `set(... CACHE PATH ...)`
# with no $ENV{} fallback, so an environment variable of that name does nothing
# and the dependency cache below would silently archive an empty directory.
# It matters for every job now, not just the oracle ones -- the reference
# spglib is the source the data tables are transcribed from, so it is cloned on
# every configure.
#
# Every job below drives CMakePresets.json rather than spelling out its own
# -D flags: `cmake --preset X && cmake --build --preset X && ctest --preset X`
# is exactly what a developer runs locally, so a green CI run means the
# configuration a developer gets is the configuration that was tested. The only
# -D flags that appear here are the ones that are genuinely about running on a
# shared runner -- an install prefix, a compiler launcher, a short dependency
# path -- and never about what the project is.
#
# The presets do NOT pin a compiler, which is why the matrix below can vary it.
# CMakeLists.txt enforces the version floors (GCC 15+, MSVC 19.43+).

jobs:
  #
  # Build, test and install across the supported toolchains. MSVC has its own
  # job below rather than a matrix entry here: it is advisory, and its runner,
  # compiler launcher and dependency cache all differ from these.
  #
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 15 (debug)
            cc: gcc-15
            cxx: g++-15
            preset: debug
          - name: GCC 15 (release)
            cc: gcc-15
            cxx: g++-15
            preset: release
          - name: Clang 20 (debug)
            cc: clang-20
            cxx: clang++-20
            preset: debug
          - name: Clang 20 (release)
            cc: clang-20
            cxx: clang++-20
            preset: release

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned rather than inherited from the runner image. The data tables are
      # transcribed at build time by tools/transcribe_*.py (stdlib only, no uv
      # sync needed), so an image that ever dropped python3 would fail every
      # job at configure time at once.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # GCC 15 goes on for every entry, not just the GCC ones: Clang here uses
      # libstdc++, and <generator> plus the C++23 range adaptors only exist in
      # libstdc++ 15.
      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 ninja-build

      - name: Install Clang 20
        if: startsWith(matrix.cc, 'clang')
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20

      # No launcher flag needed: CMakeLists.txt picks ccache up from PATH.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.cc }}-${{ matrix.preset }}
          max-size: 500M

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.deps
          key: deps-${{ matrix.cc }}-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            deps-${{ matrix.cc }}-${{ matrix.preset }}-

      # The presets default to gcc-15/g++-15 so that a bare `cmake --preset debug`
      # works on a developer machine and in CLion. Overriding on the command
      # line is what makes the same preset serve the Clang rows.
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel

      # A smoke run of the [!benchmark] cases, not a regression gate: a shared
      # CI runner's timings are far too noisy for that (see the interleaved
      # triplicate protocol the numbers in the perf notes were taken with).
      # What this catches is the benchmark target silently rotting -- failing
      # to build, or throwing on a cell it used to handle.
      - name: Benchmarks (smoke)
        if: matrix.preset == 'release'
        run: ./build/release/tests/seitz_tests "[!benchmark]" --benchmark-samples 3

      - name: Install
        run: cmake --install build/${{ matrix.preset }}

      # The seven transcribed tables are generated into the build tree, not
      # committed. This matters beyond tidiness: the `#pragma GCC visibility
      # push(default)` window in the three public ones used to exist only in the
      # committed copies and not in the generators, so a regeneration would have
      # silently unexported them. The generators emit it now; re-committing a
      # table would restart that drift.
      - name: The data tables are generated, not committed
        if: matrix.preset == 'debug' && matrix.cc == 'gcc-15'
        run: |
          tracked=$(git ls-files \
            include/seitz/data/element_tables.hpp \
            include/seitz/data/spacegroup_metadata_tables.hpp \
            include/seitz/data/magnetic_spacegroup_metadata_tables.hpp \
            src/data/spacegroup_operation_tables.hpp \
            src/data/magnetic_spacegroup_operation_tables.hpp \
            src/data/hall_generators.hpp \
            src/data/sitesym_tables.hpp)
          if [ -n "$tracked" ]; then
            echo "::error::These tables are generated by the codegen block in CMakeLists.txt and must not be committed:"
            echo "$tracked"
            exit 1
          fi

  #
  # Address/UB sanitizers against the reference spglib oracle. Split out
  # because it is the slowest configuration and the one whose failures say
  # something the plain builds cannot.
  #
  sanitizers:
    name: GCC 15 (asan)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned rather than inherited from the runner image. The data tables are
      # transcribed at build time by tools/transcribe_*.py (stdlib only, no uv
      # sync needed), so an image that ever dropped python3 would fail every
      # job at configure time at once.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: asan
          max-size: 500M

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.deps
          key: deps-asan-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            deps-asan-

      - name: Configure
        run: >
          cmake --preset asan
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        run: ctest --preset asan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # Python bindings. Builds the extension, runs pytest, and checks that the
  # committed stubs still match the built module: regenerating is mechanical,
  # and a stale stub should fail the build rather than rot.
  #
  # This job carries a second, less obvious duty. The `python` preset is the
  # only one that sets SEITZ_BUILD_ORACLE_TESTS=OFF, which is what selects
  # the download-only branch of the spglib fetch in cmake/Dependencies.cmake
  # (SOURCE_SUBDIR naming a directory with no CMakeLists.txt, so the tables are
  # transcribed from the checkout without a second crystallography library
  # being configured). Every plain consumer build and every `pip install .`
  # takes that branch, so if this preset ever turns the oracle on, the branch
  # most users actually hit stops being exercised anywhere in CI.
  #
  python:
    name: python bindings
    runs-on: ubuntu-24.04
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same as the other jobs: gcc-15 is not in Ubuntu 24.04's own repositories,
      # so the toolchain PPA has to come first. ninja-build because the presets
      # ask for the Ninja generator.
      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.deps
          key: deps-python-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            deps-python-

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the dev tools
        run: uv sync

      # Through CMake, not an editable install: an editable install works via a
      # meta-path finder that would shadow this build tree (see pyproject.toml).
      - name: Configure and build
        run: |
          cmake --preset python \
            -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps \
            -DPython_EXECUTABLE="$(uv run python -c 'import sys; print(sys.executable)')"
          cmake --build --preset python

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/build/python/python
        run: uv run pytest python/tests -q

      - name: Check the committed stubs are current
        env:
          PYTHONPATH: ${{ github.workspace }}/build/python/python
        run: |
          uv run python tools/fix_core_stubs.py
          git diff --exit-code python/seitz/_core

  #
  # MSVC, advisory. Everything portable: library, unit tests, the reference
  # spglib oracle, the benchmark smoke run and install -- the same `release`
  # preset the Linux jobs use, with no Windows-specific project configuration.
  #
  # continue-on-error because nothing here had ever been compiled with cl.exe
  # before this job existed, and its first failures are expected to be
  # library-maturity ones (<generator>, the constexpr budget) rather than
  # defects in this tree. Promoting it to a required job is a separate,
  # deliberate change once it has been green for a while.
  #
  # Release only. MSVC Debug turns on _ITERATOR_DEBUG_LEVEL=2, which would make
  # the benchmark smoke run meaningless and surface MSVC-STL debug assertions
  # that say nothing about portability -- and the constexpr tables, which are
  # the bulk of the build, would be paid for twice.
  #
  windows:
    name: MSVC 2022 (release, advisory)
    runs-on: windows-2022
    continue-on-error: true
    # The default is 360. What wants bounding here is a runaway constant
    # evaluation: msg_database.cpp decodes 76683 operations at compile time with
    # the budget raised to 10^8, on an evaluator slower and hungrier than GCC's.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned rather than inherited from the runner image. The data tables are
      # transcribed at build time by tools/transcribe_*.py (stdlib only, no uv
      # sync needed), so an image that ever dropped python3 would fail every
      # job at configure time at once.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Puts cl.exe and the SDK on PATH, via GITHUB_ENV so the later steps
      # inherit it. That is all the presets' Ninja generator needs -- no
      # compiler is pinned in the preset, so cl is simply what it finds.
      #
      # Written out rather than ilammy/msvc-dev-cmd@v1, which is what this was:
      # that action still declares node20 at its latest release and was the one
      # thing left printing a deprecation notice on every Windows run. What it
      # does is the whole of the script below.
      - name: Set up MSVC (x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $root) { throw "no Visual Studio with the C++ toolset found" }
          $vcvars = Join-Path $root 'VC\Auxiliary\Build\vcvars64.bat'
          # `set` in a fresh cmd, after vcvars: the whole environment the
          # toolset wants. Only what vcvars actually changed is forwarded, and
          # the banner lines it prints have no name=value shape, so the match
          # drops them along with cmd's `=C:`-style pseudo-variables.
          $env_after = & "$env:COMSPEC" /s /c "`"$vcvars`" && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }
          foreach ($line in $env_after) {
            if ($line -notmatch '^([^=\s]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ([Environment]::GetEnvironmentVariable($name) -eq $value) { continue }
            [Environment]::SetEnvironmentVariable($name, $value)
            "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          # Fails here, with a name, rather than at configure time with a
          # CMake message about no working compiler.
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "cl.exe is not on PATH after vcvars64.bat" }
          Write-Host "cl.exe: $($cl.Source)"

      # sccache, not ccache: ccache's cl.exe support is narrow. Same action,
      # different variant. Unlike ccache on Linux, CMakeLists.txt does not go
      # looking for it, so the launcher is passed below -- along with the
      # embedded debug format, which is what lets sccache cache the output at
      # all (it cannot cache a separate PDB).
      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          variant: sccache
          key: msvc-release
          max-size: 500M

      # C:/d because Boost 1.88's superproject nested under the default
      # D:\a\Seitz\Seitz\build\release\_deps runs into MAX_PATH.
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: C:/d
          key: deps-msvc-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            deps-msvc-

      - name: Configure
        run: >
          cmake --preset release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DFETCHCONTENT_BASE_DIR=C:/d
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        run: ctest --preset release --parallel

      - name: Benchmarks (smoke)
        run: ./build/release/tests/seitz_tests.exe "[!benchmark]" --benchmark-samples 3

      - name: Install
        run: cmake --install build/release

  #
  # Python bindings on Windows, also advisory. Its own job rather than steps in
  # the one above because the two fail for unrelated reasons -- compiler and
  # library maturity there, extension-loading and interpreter plumbing here --
  # and a combined job would need triage on every red run to tell which.
  #
  windows-python:
    name: python bindings (Windows, advisory)
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same vcvars64.bat hand-off as the job above; see the comment there.
      - name: Set up MSVC (x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $root) { throw "no Visual Studio with the C++ toolset found" }
          $vcvars = Join-Path $root 'VC\Auxiliary\Build\vcvars64.bat'
          # `set` in a fresh cmd, after vcvars: the whole environment the
          # toolset wants. Only what vcvars actually changed is forwarded, and
          # the banner lines it prints have no name=value shape, so the match
          # drops them along with cmd's `=C:`-style pseudo-variables.
          $env_after = & "$env:COMSPEC" /s /c "`"$vcvars`" && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }
          foreach ($line in $env_after) {
            if ($line -notmatch '^([^=\s]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ([Environment]::GetEnvironmentVariable($name) -eq $value) { continue }
            [Environment]::SetEnvironmentVariable($name, $value)
            "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          # Fails here, with a name, rather than at configure time with a
          # CMake message about no working compiler.
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "cl.exe is not on PATH after vcvars64.bat" }
          Write-Host "cl.exe: $($cl.Source)"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the dev tools
        run: uv sync

      - name: Configure and build
        run: |
          cmake --preset python -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DFETCHCONTENT_BASE_DIR=C:/d `
            "-DPython_EXECUTABLE=$(uv run python -c 'import sys; print(sys.executable)')"
          cmake --build --preset python

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/build/python/python
        run: uv run pytest python/tests -q

      # No stub-freshness check here, unlike the Linux python job. The runner
      # sets core.autocrlf=true and the tree carries no .gitattributes, so
      # `git diff --exit-code` on generated .pyi files is a line-ending coin
      # flip carrying no portability signal. It is repo hygiene, and the Linux
      # job already answers it.
